function vSetup(grp){const f=grp.format,o=grp.opts,n=grp.pairs.length,min=FORMATS[f].min;
  let opts='';

  if(f==='swiss')opts=`<div class="field"><span class="lbl">Rounds</span>${stepper('swissRounds',o.swissRounds||swissTotal(grp),1,Math.max(1,n-1))}</div><p class="note" style="margin:0">Suggested for ${n} pairs: ${Math.min(n-1,Math.ceil(Math.log2(n))+1)} rounds. With an odd count, the lowest-ranked pair without a bye sits out and gets the win.</p>`;
  if(f==='kotc')opts=`<div class="field"><span class="lbl">Rounds</span>${stepper('kotcRounds',o.kotcRounds,1,30)}</div><div class="field"><span class="lbl">Top court name</span><div class="seg">${['King','Queen'].map(t=>`<button data-act="opt" data-k="kotcTitle" data-v="${t}" class="${o.kotcTitle===t?'on':''}">${t}</button>`).join('')}</div></div><p class="note" style="margin:0">${Math.floor(n/2)} courts in use${n%2?', one pair waits each round and rotates in on the bottom court':''}. A win scores 1 point; a win on the top court scores 1 more.</p>`;
  if(f==='ladder')opts=`<div class="field"><span class="lbl">Challenge up to</span>${stepper('range',o.range,1,Math.max(1,n-1))}</div><p class="note" style="margin:0">spots above. A challenger who wins takes the defender's rank; everyone between moves down one.</p>`;
  if(f==='de')opts=`<label class="toggle"><input type="checkbox" id="opt_gf" data-act="gfreset" ${o.gfReset?'checked':''}> Play a reset game if the losers-bracket team wins the grand final</label>`;
  if(f==='se')opts=`<p class="note" style="margin:0">${pow2(n)}-slot bracket${pow2(n)>n?`, ${pow2(n)-n} top seeds get a first-round bye`:''}. Seed 1 is listed first below.</p>`;
  const pasteOpen=ui.paste[grp.id],bracketed=hasBrackets(grp),GC=bracketCount(grp),manualDraw=bracketed&&GC>1&&o.drawMode==='manual',prob=drawProblem(grp);
  return`<section class="sec"><h3>Group</h3><div class="row"><div class="field" style="flex:1 1 240px"><label for="grp_name">Group name</label><input type="text" id="grp_name" data-act="grpname" value="${esc(grp.name)}"></div>
    <div class="field"><span class="lbl">Number of pairs</span>${stepper('pairs',n,2,64)}</div>
    ${f==='rr'||f==='pool'?bracketField(grp):''}
    <div class="field"><span class="lbl">Games to</span><div class="seg">${[11,15,21].map(g=>`<button data-act="gameto" data-v="${g}" class="${grp.gameTo===g?'on':''}">${g}</button>`).join('')}</div></div>
    <label class="toggle" style="padding-bottom:8px"><input type="checkbox" id="grp_winby" data-act="winby" ${grp.winBy?'checked':''}> Win by 2</label></div></section>
  <section class="sec"><h3>Mode of play</h3><div class="fmts">${Object.entries(FORMATS).map(([k,v])=>`<button class="fmt ${f===k?'on':''}" data-act="format" data-v="${k}" aria-pressed="${f===k}"><b>${v.name}</b><span>${v.blurb}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:14px">${opts}</div></section>
  <section class="sec"><h3>Pairs <span class="note">Order sets the seeding</span></h3>
    <div class="row" style="margin-bottom:12px"><button class="btn sm" data-act="shuffle">Shuffle seeds</button><button class="btn sm" data-act="pastetoggle">${pasteOpen?'Close list':'Paste a list'}</button></div>
    ${pasteOpen?`<div style="margin-bottom:12px"><textarea id="paste_${grp.id}" placeholder="One pair per line, e.g.&#10;Reyes / Santos&#10;Cruz / Bautista"></textarea><div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="pasteapply">Replace pairs with this list</button></div></div>`:''}
    <div class="pairs">${grp.pairs.map((p,i)=>`<div class="pairin"><span class="sd">${i+1}</span><input type="text" id="pn_${p.id}" data-act="pname" data-id="${p.id}" value="${esc(p.name)}" aria-label="Pair ${i+1} name">${manualDraw?bracketSelect(p,GC,'pb_',pairBracket(grp,p,i,GC)):''}</div>`).join('')}</div></section>
  <div class="row"><button class="btn primary" data-act="start" ${n<min||prob?'disabled':''}>Generate matches</button>${n<min?`<span class="note">${FORMATS[f].name} needs at least ${min} pairs.</span>`:prob?`<span class="err">${esc(prob)}</span>`:''}</div>`}
function bracketOpts(grp){const o=grp.opts,n=grp.pairs.length,isPool=grp.format==='pool',splitKey=isPool?'pools':'brackets',word=isPool?'Pools':'Brackets',one=isPool?'pool':'bracket';
  const G=bracketCount(grp),po=isPool||o.rrPlayoff,assign=bracketAssign(grp,G),sizes=assign.map(g=>g.length),minSize=Math.max(1,Math.min(...sizes)),adv=Math.max(1,Math.min(o.advance,minSize)),fmt=o.poFormat||'se',manual=o.drawMode==='manual';
  let h='';
  if(!isPool)h+=`<label class="toggle" style="padding-bottom:8px"><input type="checkbox" id="opt_rrpo" data-act="rrpo" ${o.rrPlayoff?'checked':''}> Play-off after round robin</label>`;
  const bqf=po&&o.poStart==='bqf';
  if(po)h+=`<div class="field"><span class="lbl">Play-off starts with</span><div class="seg">${[['direct','Direct to play-off'],['bqf','Quarterfinals']].map(([k,v])=>`<button data-act="opt" data-k="poStart" data-v="${k}" class="${(o.poStart||'direct')===k?'on':''}">${v}</button>`).join('')}</div></div>`;
  const QK=qfCountOf(grp),inG=QK===2*G;
  if(bqf){h+=`<div class="field"><span class="lbl">Quarterfinal matches</span>${stepper('qfCount',QK,2,Math.max(2,Math.floor(n/2)))}<span class="note" style="font-size:11.5px;max-width:210px">${inG?`2 per ${one} (default)`:`${2*QK} pairs qualify.${2*G<=Math.floor(n/2)?` Default is ${2*G} (2 per ${one}).`:` Max ${Math.floor(n/2)} with ${n} pairs.`}`}</span></div><div class="field"><span class="lbl">Quarterfinal matchups</span>${qfSeg(o.qfSeed||'std')}</div><div class="field"><span class="lbl">Semifinal seeding</span><div class="seg">${[['rank','Ranking'],['diff','Point difference'],['manual','Assign manually']].map(([k,v])=>`<button data-act="opt" data-k="semiSeed" data-v="${k}" class="${(o.semiSeed||'rank')===k?'on':''}">${v}</button>`).join('')}</div></div>
    ${QK>=4?`<label class="toggle" style="padding-bottom:8px"><input type="checkbox" id="opt_bronze" data-act="bronze" ${o.bronze?'checked':''}> 3rd place match</label>`:''}
    <p class="preview"><b>Play-off</b>${esc(bqPreview(G,o.semiSeed||'rank',o.bronze,o.qfSeed,QK))}</p>
    <p class="note" style="flex-basis:100%;margin:0">${(o.qfSeed||'std')==='manual'?`After the ${one} stage you choose all ${QK} quarterfinal matchups. They start from the standard pairing, and you can change any of them, including across ${one}s. `:inG?`Top 4 of each ${one} play: 1st vs 4th and 2nd vs 3rd. `:`The best ${2*QK} pairs qualify: ${one} winners first, then runners-up and so on, ranked by record. Highest seed plays lowest, with same-${one} pairs kept apart where possible. `}${({rank:'Ranking: winners who finished higher in their bracket get the better seeds, and teams from the same bracket are kept apart.',diff:'Point difference: winners are seeded by point differential across their bracket and quarterfinal games.',manual:'Assign manually: after the quarterfinals you choose who plays who.'})[o.semiSeed||'rank']}</p>`}
  else if(po){h+=`<div class="field"><span class="lbl">Top per ${one} advance</span>${stepper('advance',adv,1,Math.max(1,minSize))}</div>
    <div class="field"><span class="lbl">Play-off format</span><div class="seg">${Object.entries({se:'Knockout',de:'Double elim',rr:'Round robin'}).map(([k,v])=>`<button data-act="opt" data-k="poFormat" data-v="${k}" class="${fmt===k?'on':''}">${v}</button>`).join('')}</div></div>
    ${fmt!=='rr'?`<div class="field"><span class="lbl">Play-off seeding</span><div class="seg">${Object.entries({cross:'Crossover',record:'By record'}).map(([k,v])=>`<button data-act="opt" data-k="poSeed" data-v="${k}" class="${(o.poSeed||'cross')===k?'on':''}">${v}</button>`).join('')}</div></div>`:''}
    ${fmt==='se'&&G*adv>=4?`<label class="toggle" style="padding-bottom:8px"><input type="checkbox" id="opt_bronze" data-act="bronze" ${o.bronze?'checked':''}> 3rd place match</label>`:''}
    ${fmt==='de'?`<label class="toggle" style="padding-bottom:8px"><input type="checkbox" id="opt_gf" data-act="gfreset" ${o.gfReset?'checked':''}> Grand-final reset game</label>`:''}
    <p class="preview"><b>Play-off</b>${esc(playoffPreview(G,adv,fmt==='de'&&G*adv<3?'se':fmt,o.poSeed||'cross',o.bronze))}</p>`}
  const games=sizes.reduce((t,s)=>t+s*(s-1)/2,0),lo=Math.min(...sizes),hi=Math.max(...sizes);
  h+=`<p class="note" style="flex-basis:100%;margin:0">${G>1?`${G} ${one}s of ${lo===hi?lo:`${lo}–${hi}`} pairs. `:''}${games} round-robin matches. Ranked by wins, then head-to-head, +/−, and fewest points allowed. You can set the order by hand at any time.${!po&&G>1?` Each ${one} finishes with its own winner. Turn on the play-off to crown one champion.`:''}</p>`;
  if(G>1){const seed={};grp.pairs.forEach((p,i)=>seed[p.id]=i+1);const Lw=isPool?'Pool':'Bracket';
    h+=`<div style="flex-basis:100%"><div class="row" style="justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px"><span class="lbl">${Lw} draw</span>
      <div class="row" style="gap:8px;align-items:center">${manual?'<button class="btn sm ghost" data-act="drawsnake">Reset to snake draw</button>':''}<div class="seg">${[['auto','Snake seeding'],['manual','Assign manually']].map(([k,v])=>`<button data-act="drawmode" data-v="${k}" class="${(manual?'manual':'auto')===k?'on':''}">${v}</button>`).join('')}</div></div></div>
      <div class="draw">${assign.map((g,gi)=>`<div class="dg ${g.length<2?'bad':''}"><div class="dgh">${Lw} ${LET[gi]} <span>${g.length} pair${g.length===1?'':'s'}</span></div><ol>${g.length?g.map(p=>`<li><span class="sd">${seed[p.id]}</span><span class="dn">${esc(p.name||`Pair ${seed[p.id]}`)}</span>${manual?bracketSelect(p,G,'pbd_',gi):''}</li>`).join(''):`<li class="note">No pairs yet</li>`}</ol></div>`).join('')}</div>
      <p class="note" style="margin:6px 0 0">${manual?`Pick a ${one} for each pair here or in the pairs list below. Each ${one} needs at least 2 pairs.`:`Seeds are spread across ${one}s automatically. Choose Assign manually to place pairs yourself.`}</p></div>`}
  return h}
function bracketSelect(p,G,pre,cur){return`<select class="gsel" id="${pre}${p.id}" data-act="pbracket" data-id="${p.id}" aria-label="Bracket for ${esc(p.name)}">${Array.from({length:G},(_,g)=>`<option value="${g}" ${cur===g?'selected':''}>${LET[g]}</option>`).join('')}</select>`}
function drawProblem(grp){if(!hasBrackets(grp))return'';const G=bracketCount(grp),sizes=bracketAssign(grp,G).map(g=>g.length),one=grp.format==='pool'?'pool':'bracket';
  const man=isBQ(grp)&&qfManualOpt(grp),need=isBQ(grp)&&!man&&qfInBracket(grp)?4:2,bad=sizes.map((s,i)=>s<need?LET[i]:null).filter(Boolean);
  if(bad.length&&need===4)return`${one[0].toUpperCase()+one.slice(1)} ${bad.join(', ')} need${bad.length>1?'':'s'} 4 pairs for 1 vs 4 and 2 vs 3. Change the number of quarterfinal matches, or use fewer ${one}s.`;
  return bad.length?`${one[0].toUpperCase()+one.slice(1)} ${bad.join(', ')} need${bad.length>1?'':'s'} at least ${need} pairs${need===4?` for quarterfinals inside each ${one}`:''}.`:''}
function bracketField(grp){const isPool=grp.format==='pool',splitKey=isPool?'pools':'brackets',mx=maxBrackets(grp.pairs.length),G=Math.max(1,Math.min(grp.opts[splitKey]||1,mx));
  const w=isPool?'pools':'brackets',hint=mx<MAX_BRACKETS?`Max ${mx} with ${grp.pairs.length} pairs. Up to ${MAX_BRACKETS} ${w} with ${MAX_BRACKETS*2}+ pairs.`:`Up to ${MAX_BRACKETS} ${w}.`;
  return`<div class="field"><span class="lbl">Number of ${w}</span>${stepper(splitKey,G,1,mx)}<span class="note" style="font-size:11.5px;max-width:200px">${hint}</span></div>`}
function stepper(k,v,min,max){return`<div class="step"><button data-act="stp" data-k="${k}" data-d="-1" ${v<=min?'disabled':''} aria-label="Decrease">−</button><input id="stp_${k}" data-act="stpin" data-k="${k}" data-min="${min}" data-max="${max}" inputmode="numeric" value="${v}"><button data-act="stp" data-k="${k}" data-d="1" ${v>=max?'disabled':''} aria-label="Increase">+</button></div>`}

function vLive(grp,R){const f=grp.format,ids=grp.pairs.map(p=>p.id),ch=champion(grp,R);let h='';
  /* the podium opens as a pop-up: see vPodiumModal */
  if(grp.data.pools)return h+bracketView(grp,R);
  if(f==='rr'){h+=`<section class="sec"><h3>Standings <span class="note">${ids.length-1} games each · ranked by wins, head-to-head, +/−, then fewest points allowed</span></h3>${rankTable(grp,'all',tableFor(grp,'all',R),{of:ids.length-1,complete:grp.matches.every(m=>R[m.id].done)})}</section><section class="sec"><h3>Matches</h3>${rounds(grp,grp.matches,R,grp.data.sits)}</section>`}
  if(f==='se'){h+=`<section class="sec"><h3>Bracket</h3>${elim(grp,grp.matches,R,seName,'se')}</section>`}
  if(f==='de')h+=deView(grp,R,grp.matches,'',(t,n,b)=>`<section class="sec"><h3>${t}${n?` <span class="note">${n}</span>`:''}</h3>${b}</section>`);
  if(f==='swiss'){const rd=Math.max(...grp.matches.map(m=>m.round)),cm=grp.matches.filter(m=>m.round===rd),done=cm.every(m=>R[m.id].done);const past=grp.matches.filter(m=>m.round<rd);
    h+=`<div class="two"><section class="sec"><h3>Standings <span class="note">Wins, then Buchholz, then point differential</span></h3>${rankTable(grp,'all',tableFor(grp,'all',R),{buch:true})}</section>
    <section class="sec"><h3>Round ${rd} of ${grp.data.total}</h3><div class="grid-m">${cm.map(m=>matchCard(grp,m,R)).join('')}</div>
    <div class="row" style="margin-top:12px">${rd<grp.data.total?`<button class="btn primary" data-act="swissnext" ${done?'':'disabled'}>Pair round ${rd+1}</button><span class="note">${done?'Pairs teams with matching records and skips rematches.':'Enter every score in this round first.'}</span>`:`<span class="note">${done?'All rounds played.':'Final round.'}</span>`}${rd>1?cbtn('undoround','Undo this round','sm ghost danger'):''}</div>
    ${past.length?`<details class="past" style="margin-top:12px"><summary>Earlier rounds</summary>${rounds(grp,past,R)}</details>`:''}</section></div>`}
  if(f==='kotc'){const rd=Math.max(...grp.matches.map(m=>m.round)),cm=grp.matches.filter(m=>m.round===rd).sort((a,b)=>a.court-b.court),done=cm.every(m=>R[m.id].done),wait=grp.data.wait[rd-1]||[];const past=grp.matches.filter(m=>m.round<rd);
    h+=`<div class="two"><section class="sec"><h3>Round ${rd} of ${grp.opts.kotcRounds} <span class="note">Winners move up, losers move down</span></h3><div class="courts">${cm.map(m=>`<div class="court ${m.court===1?'top':''}"><div class="cn"><b>${m.court}</b><span>${m.court===1?esc(grp.opts.kotcTitle)+' ct':'Court'}</span></div>${matchCard(grp,m,R)}</div>`).join('')}</div>
    ${wait.length?`<p class="wait">Waiting: <b>${esc(nm(wait[0]))}</b> rotates in on court ${cm.length} next round.</p>`:''}
    <div class="row" style="margin-top:12px">${rd<grp.opts.kotcRounds?`<button class="btn primary" data-act="kotcnext" ${done?'':'disabled'}>Move courts · round ${rd+1}</button>`:`<span class="note">${done?'All rounds played.':'Final round.'}</span>`}${rd>1?cbtn('undoround','Undo this round','sm ghost danger'):''}</div>
    ${past.length?`<details class="past" style="margin-top:12px"><summary>Earlier rounds</summary>${rounds(grp,past,R)}</details>`:''}</section>
    <section class="sec"><h3>Standings <span class="note">Points, then point differential</span></h3>${rankTable(grp,'all',tableFor(grp,'all',R),{kc:true})}</section></div>`}
  if(f==='ladder'){const order=ladderOrder(grp,R),st={};standings(ids,grp.matches,R).forEach(s=>st[s.id]=s);
    const busy=new Set();grp.matches.forEach(m=>{if(!R[m.id].done){busy.add(m.srcA.id);busy.add(m.srcB.id)}});
    const pending=grp.matches.filter(m=>!R[m.id].done),done=grp.matches.filter(m=>R[m.id].done).reverse();
    h+=`<div class="two"><section class="sec"><h3>Ladder</h3><ol class="lad">${order.map((id,i)=>{const s=st[id];const targets=order.slice(Math.max(0,i-grp.opts.range),i).filter(t=>!busy.has(t));
      return`<li><div class="ladr"><span class="rk">${i+1}</span><span class="nm">${esc(nm(id))}</span><span class="rec">${s.w}–${s.l}</span>${i>0?`<button class="btn sm" data-act="chal" data-id="${id}" ${busy.has(id)||!targets.length?'disabled':''}>${ui.challenge===id?'Cancel':'Challenge'}</button>`:'<span class="chip">Top</span>'}</div>
      ${ui.challenge===id?`<div class="pick"><span class="note" style="flex-basis:100%">Challenge which pair?</span>${targets.map(t=>`<button class="btn sm" data-act="chalto" data-a="${id}" data-b="${t}">#${order.indexOf(t)+1} ${esc(nm(t))}</button>`).join('')}</div>`:''}</li>`}).join('')}</ol></section>
    <section class="sec"><h3>Challenges</h3>${pending.length?`<div class="grid-m">${pending.map(m=>`<div>${matchCard(grp,m,R)}<button class="btn sm ghost" data-act="chaldel" data-m="${m.id}" style="margin-top:4px">Cancel challenge</button></div>`).join('')}</div>`:'<p class="empty">No open challenges. Pick a pair on the ladder and press Challenge.</p>'}
    ${done.length?`<details class="past" style="margin-top:12px" open><summary>Results (${done.length})</summary><div class="grid-m">${done.map(m=>matchCard(grp,m,R)).join('')}</div></details>`:''}</section></div>`}
  return h}

/* Winners podium: 3rd on the left, champion in the middle, 2nd on the right */
/* 3rd place when no 3rd place match decided it: losers-bracket final loser (double elim), or both semifinal losers (knockout) */
function thirdFallback(grp,R){const ko=grp.data.pools?grp.matches.filter(m=>m.po):grp.matches,fmt=grp.data.pools?(grp.data.poFmt||'se'):grp.format;
  if(fmt==='de'){const lb=ko.filter(m=>m.stage==='lb');if(!lb.length)return[];const K=Math.max(...lb.map(m=>m.round)),r=R[lb.find(m=>m.round===K).id];return r.done&&!r.bye&&r.l!=='BYE'?[r.l]:[]}
  if(fmt==='se'){const x=ko.filter(m=>!m.bronze);if(!x.length)return[];const K=Math.max(...x.map(m=>m.round));
    return x.filter(m=>m.round===K-1).map(m=>R[m.id]).filter(r=>r.done&&!r.bye&&r.l&&r.l!=='BYE').map(r=>r.l)}
  return[]}
function vPodium(grp,R,ch){const pd=ch?podium(grp,R,ch):{second:null,third:null};
  let third=pd.third?[pd.third]:ch?thirdFallback(grp,R):[];const joint=third.length>1;
  const slot=(cls,place,label,ids,empty)=>{ids=(Array.isArray(ids)?ids:[ids]).filter(Boolean);return`<div class="pod ${cls} ${ids.length?'set':''}"><div class="pn">${cls==='p1'?BALL:''}<span class="pname">${ids.length?ids.map(id=>esc(nm(id))).join('<br><small>&amp;</small><br>'):`<i>${empty}</i>`}</span></div><div class="pb"><b>${place}</b><span>${label}</span></div></div>`};
  return`<section class="podium" aria-label="Winners podium"><div class="podt">${ch?'Final results':'Winners preview'}</div><div class="pods">${slot('p3','3',joint?'Joint 3rd':'3rd place',third,ch?'Not decided':'To be decided')}${slot('p1','1','Champion',ch,'To be decided')}${slot('p2','2','2nd place',pd.second,'To be decided')}</div></section>`}

/* confetti: one effects engine per window (this page, or the podium window) */
function makeFX(win){return{win,cv:null,ctx:null,ps:[],raf:0,amb:0,last:null,to:0,d:1}}
const FX=makeFX(window);
const reduceMo=F=>{try{return F.win.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
const FXC=['#FFD84D','#F6B400','#4FB894','#83A8EA','#FFFFFF','#D98A4E','#E9F25A'];
function fxCanvas(F){const doc=F.win.document;if(F.cv&&doc.body.contains(F.cv))return;const cv=doc.createElement('canvas');cv.className='confetti';cv.setAttribute('aria-hidden','true');doc.body.appendChild(cv);F.cv=cv;F.ctx=cv.getContext('2d');
  const rs=()=>{F.d=Math.min(2,F.win.devicePixelRatio||1);cv.width=F.win.innerWidth*F.d;cv.height=F.win.innerHeight*F.d};rs();F.win.addEventListener('resize',rs)}
function burst(F,n,gentle){if(F.win.closed||reduceMo(F))return;fxCanvas(F);const W=F.win.innerWidth,H=F.win.innerHeight;
  for(let i=0;i<n;i++){const s=gentle?0:i%3;let x,y,vx,vy;if(s===0){x=Math.random()*W;y=-20-Math.random()*60;vx=(Math.random()-.5)*2;vy=Math.random()*2+1}else{x=s===1?0:W;y=H*.8;vx=(s===1?1:-1)*(Math.random()*10+5);vy=-(Math.random()*13+10)}
    F.ps.push({x,y,vx,vy,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:Math.random()*8+5,h:Math.random()*5+3,c:FXC[i%FXC.length],t:Math.random()*6,ball:Math.random()<.1})}
  if(!F.raf)F.raf=F.win.requestAnimationFrame(()=>fxTick(F))}
function fxTick(F){if(F.win.closed){F.raf=0;F.ps=[];return}const{ctx,cv,d}=F,H=F.win.innerHeight;ctx.clearRect(0,0,cv.width,cv.height);F.ps=F.ps.filter(p=>p.y<H+40);
  for(const p of F.ps){p.vy=Math.min(p.vy+.2,4.2);p.vx*=.985;p.t+=.06;p.x+=p.vx+Math.sin(p.t)*.7;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x*d,p.y*d);ctx.rotate(p.r);ctx.fillStyle=p.ball?'#E9F25A':p.c;
    if(p.ball){ctx.beginPath();ctx.arc(0,0,p.w*.75*d,0,7);ctx.fill()}else ctx.fillRect(-p.w*d/2,-p.h*d/2*Math.abs(Math.cos(p.t)),p.w*d,p.h*d*Math.abs(Math.cos(p.t))+1);ctx.restore()}
  F.raf=F.ps.length?F.win.requestAnimationFrame(()=>fxTick(F)):0}
function ambient(F,on){if(on&&F.amb)return;clearInterval(F.amb);F.amb=0;if(on&&!reduceMo(F))F.amb=setInterval(()=>{if(F.win.closed){clearInterval(F.amb);F.amb=0;return}if(F.win.document.visibilityState==='visible')burst(F,16,true)},3200)}
function stageFX(F,s){if(!s||!s.ch){F.last=null;ambient(F,false);return}
  if(F.last!==s.key){F.last=s.key;clearTimeout(F.to);F.to=setTimeout(()=>burst(F,260),1500)}ambient(F,true)}

/* ---------- courts: named courts for the whole event, match assignment, live courts screen ----------
   S.courts = [{id,name}]. A match on a court has m.courtId, m.courtName and m.startedAt (ms); m.finishedAt is set when its result is in.
   A court is "in use" while a match assigned to it is ready (both pairs known) and has no result yet. */
const courtLabel=n=>{n=String(n||'').trim();return /^([0-9]+|[A-Za-z])$/.test(n)?'Court '+n:n};
const pairName=(g,id)=>{if(!id||id==='BYE')return'Bye';const i=g.pairs.findIndex(p=>p.id===id);return i<0?'—':(g.pairs[i].name||`Pair ${i+1}`)};
const clockFmt=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};

let CU={};/* court use for the current render: courtId -> {g,m,r} */
function courtUse(){const use={};for(const g of S.groups){if(g.status!=='live')continue;const R=resolve(g);
  for(const m of g.matches){if(m.courtId&&matchOpen(R[m.id]))use[m.courtId]={g,m,r:R[m.id]}}}return use}
/* Ready matches without a court, interleaved across groups by round */
function waitingMatches(use){const busy=new Set(Object.values(use).map(u=>u.m.id)),out=[];
  S.groups.forEach((g,gi)=>{if(g.status!=='live')return;const R=resolve(g);g.matches.forEach((m,mi)=>{if(!busy.has(m.id)&&matchOpen(R[m.id]))out.push({g,m,r:R[m.id],k:[m.round||0,gi,mi]})})});
  return out.sort((x,y)=>(x.k[0]-y.k[0])||(x.k[1]-y.k[1])||(x.k[2]-y.k[2]))}
function findMatch(gid,mid){const g=S.groups.find(x=>x.id===gid),m=g&&g.matches.find(x=>x.id===mid);return m?{g,m}:null}

const csOpen=()=>!!(CW.w&&!CW.w.closed)||!!ui.courtsModal;
function courtsDoc(){const css=[...document.querySelectorAll('style')].map(s=>s.outerHTML).join('');
  return`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courts</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">${css}<style>html,body{margin:0;padding:0;background:#06131f;min-height:100%}</style></head><body><div id="csroot"></div><div class="st-bar"><button class="st-btn" id="fsb">Full screen</button></div></body></html>`}
function openCourtsWindow(){let w=null;try{w=window.open('','drCourts','popup=yes,width=1280,height=760')}catch(e){w=null}if(!w)return false;
  try{const d=w.document;if(!d.getElementById('csroot')){d.open();d.write(courtsDoc());d.close()}
    const fb=d.getElementById('fsb');if(fb&&!fb.dataset.wired){fb.dataset.wired='1';fb.addEventListener('click',()=>{try{const p=d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}})}
  }catch(e){try{w.close()}catch(x){}return false}
  CW.w=w;CW.html='';syncCourtsWindow();try{w.focus()}catch(e){}return true}
function closeCourtsWindow(){if(CW.w){try{CW.w.close()}catch(e){}}CW.w=null}
function syncCourtsWindow(){const w=CW.w;if(!w)return;if(w.closed){CW.w=null;return}let d;try{d=w.document}catch(e){CW.w=null;return}
  const root=d.getElementById('csroot');if(!root)return;const h=courtsScreen();if(h!==CW.html){root.innerHTML=h;CW.html=h;try{d.title=(S.name?S.name+' · ':'')+'Courts'}catch(e){}}}
/* Tick every second: running timers and the clock, here and in the courts window */
setInterval(()=>{const now=Date.now(),clk=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const upd=doc=>{doc.querySelectorAll('[data-t0]').forEach(el=>{const t=+el.dataset.t0;if(t)el.textContent=clockFmt(now-t)});doc.querySelectorAll('[data-clock]').forEach(el=>{el.textContent=clk})};
  try{upd(document)}catch(e){}
  if(CW.w){if(CW.w.closed){CW.w=null;render()}else try{upd(CW.w.document)}catch(e){}}},1000);

function deView(grp,R,ms,key,wrap){const wb=ms.filter(m=>m.stage==='wb'),lb=ms.filter(m=>m.stage==='lb'),gf=ms.filter(m=>m.stage==='gf');const K=Math.max(...wb.map(m=>m.round)),LK=lb.length?Math.max(...lb.map(m=>m.round)):0;
  return wrap('Winners bracket','',elim(grp,wb,R,r=>r===K?'Winners final':r===K-1?'Winners semis':`Winners R${r}`,key+'wb'))
   +wrap('Losers bracket','One more loss here ends the run',lb.length?elim(grp,lb,R,r=>r===LK?'Losers final':`Losers R${r}`,key+'lb','lbl-l'):'<p class="empty">No losers bracket at this size.</p>')
   +wrap('Grand final','',`<div class="grid-m">${gf.filter(m=>!R[m.id].bye).map(m=>matchCard(grp,m,R)).join('')}</div>${gf[1]&&R[gf[1].id].bye?'<p class="note">The winners-bracket champion won, so no reset game is needed.</p>':''}`)}
function semiSetup(grp,R){const F=semiField(grp,R),mode=grp.opts.semiSeed||'rank',pr=semiPairs(grp,F),K=Math.log2(pr.length*2),word=grp.format==='pool'?'pool':'bracket';
  const lab=x=>x?`<span class="sd tag">${esc(x.tag)}</span> ${esc(nm(x.id))}${mode==='diff'?` <span class="note">(${x.all.diff>0?'+':''}${x.all.diff})</span>`:''}`:'<span class="note">Bye</span>';
  let h=`<div class="row" style="margin-bottom:12px;align-items:center"><span class="lbl">Seeding</span><div class="seg">${[['rank','Ranking'],['diff','Point difference'],['manual','Assign manually']].map(([k,v])=>`<button data-act="opt" data-k="semiSeed" data-v="${k}" class="${mode===k?'on':''}">${v}</button>`).join('')}</div></div>`;
  let prob='';
  if(mode==='manual'){const byes=pr.length*2>F.length;prob=manualProblem(F,pr);
    const sel=(i,j,x)=>`<select class="gsel msel" id="ms_${grp.id}_${i}_${j}" data-act="msemi" data-i="${i}" data-j="${j}" aria-label="${koLabel(K,i)}, side ${j+1}">${byes?`<option value="" ${!x?'selected':''}>Bye</option>`:''}${F.map(w=>`<option value="${w.id}" ${x&&x.id===w.id?'selected':''}>${esc(w.tag)} · ${esc(nm(w.id))}</option>`).join('')}</select>`;
    h+=`<div class="semis">${pr.map((p,i)=>`<div class="semi"><b>${koLabel(K,i)}</b><div class="semip">${sel(i,0,p[0])}<span class="vs">vs</span>${sel(i,1,p[1])}</div></div>`).join('')}</div>`}
  else h+=`<div class="semis">${pr.map((p,i)=>`<div class="semi"><b>${koLabel(K,i)}</b><div class="semip"><span>${lab(p[0])}</span><span class="vs">vs</span><span>${lab(p[1])}</span></div></div>`).join('')}</div>`;
  h+=`<div class="row" style="margin-top:12px"><button class="btn primary" data-act="seedsemi" ${prob?'disabled':''}>Start ${K===1?'final':K===2?'semifinals':'knockout'}</button>${prob?`<span class="err">${esc(prob)}</span>`:`<span class="note">${{rank:`Higher ${word} finish gets the better seed. Same-${word} teams are kept apart.`,diff:'Seeded by point differential from bracket and quarterfinal games.',manual:'Pick the two pairs for each match.'}[mode]}</span>`}</div>`;
  return h}
function qfSetup(grp,R,left){const word=grp.format==='pool'?'Pool':'Bracket',lw=word.toLowerCase(),G=grp.data.pools.length,mode=grp.opts.qfSeed||'std';
  const QK=qfCountOf(grp),hold=!left&&tieProblem(grp,R);
  let h=`<div class="row" style="margin-bottom:12px;align-items:center"><span class="lbl">Matches</span>${stepper('qfCount',QK,2,Math.max(2,Math.floor(grp.pairs.length/2)))}<span class="lbl">Matchups</span>${qfSeg(mode)}</div>`;
  if(mode==='manual'&&!left&&!hold){const tags=tagMap(grp,R),pr=qfPairs(grp,R),prob=qfProblem(pr),picked=new Set(pr.flat().filter(Boolean));
    const lists=grp.data.pools.map((pl,g)=>ranked(grp,'b'+g,pl,poolMs(grp,g),R));
    const sel=(i,j,cur)=>`<select class="gsel msel" id="mq_${grp.id}_${i}_${j}" data-act="mqf" data-i="${i}" data-j="${j}" aria-label="Quarterfinal ${i+1}, side ${j+1}"><option value="" ${!cur?'selected':''}>Pick a pair</option>${lists.map((st,g)=>`<optgroup label="${word} ${LET[g]}">${st.map(s=>`<option value="${s.id}" ${cur===s.id?'selected':''}>${tags[s.id]} · ${esc(nm(s.id))}${picked.has(s.id)&&cur!==s.id?' (picked)':''}</option>`).join('')}</optgroup>`).join('')}</select>`;
    h+=`<div class="semis">${pr.map((p,i)=>`<div class="semi"><b>Quarterfinal ${i+1}</b><div class="semip">${sel(i,0,p[0])}<span class="vs">vs</span>${sel(i,1,p[1])}</div></div>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="seedpo" ${prob?'disabled':''}>Start quarterfinals</button><button class="btn sm ghost" data-act="qfstd">${QK===2*G?'Reset to 1 vs 4 · 2 vs 3':'Reset to seeded pairing'}</button>${prob?`<span class="err">${esc(prob)}</span>`:`<span class="note">Tags show each pair's ${lw} and finish, e.g. A1 = 1st in ${word} A.</span>`}</div>`}
  else h+=`<p class="preview" style="margin-bottom:12px"><b>Plan</b>${esc(bqPreview(G,grp.opts.semiSeed||'rank',grp.opts.bronze,mode,QK))}</p>
    <div class="row">${mode==='manual'?'':`<button class="btn primary" data-act="seedpo" ${left||hold?'disabled':''}>Start quarterfinals</button>`}<span class="note">${hold?`<span class="err">${esc(hold)}</span>`:left?`${left} ${lw} match${left>1?'es':''} left before the quarterfinals.${mode==='manual'?' You can pick the matchups once they are scored.':''}`:`Uses the final ${lw} standings.`}</span></div>`;
  return h}
function bqSection(grp,R,left,pms){const word=grp.format==='pool'?'Pool':'Bracket',bq=grp.matches.filter(m=>m.bq),G=grp.data.pools.length,bqLeft=bq.filter(m=>!R[m.id].done).length,K=Math.log2(pow2(2*G));
  let h=`<section class="sec"><h3>${word} quarterfinals <span class="note">${(bq.length?grp.data.qfMode==='manual':qfManual(grp))?'Matchups assigned manually':(bq.length?grp.data.qfMode==='std':qfInBracket(grp))?`1st vs 4th and 2nd vs 3rd in each ${word.toLowerCase()}`:'Seeded across brackets: highest vs lowest'}</span>${bq.length&&!pms.length?cbtn('undobq','Undo quarterfinals','sm ghost danger'):''}</h3>`;
  if(!bq.length)h+=qfSetup(grp,R,left);
  else if(grp.data.qfMode&&grp.data.qfMode!=='std')h+=`<div class="grid-m">${bq.map(m=>matchCard(grp,m,R)).join('')}</div>`;
  else{const by=[];bq.forEach(m=>(by[m.pool]=by[m.pool]||[]).push(m));
    h+=by.map((ms,g)=>`<div class="rnd"><div class="rndh"><b>${word} ${LET[g]}</b><span class="note">${ms.filter(m=>R[m.id].done).length}/${ms.length} done</span></div><div class="grid-m">${ms.map(m=>matchCard(grp,m,R)).join('')}</div></div>`).join('')}
  h+='</section>';
  if(bq.length){h+=`<section class="sec"><h3>${koTitle(K)} ${pms.length?cbtn('reseed','Re-seed','sm'):''}</h3>`;
    if(pms.length)h+=elim(grp,pms,R,seName,'po');
    else if(bqLeft)h+=`<p class="note">${bqLeft} quarterfinal${bqLeft>1?'s':''} left. The winners move on here.</p>`;
    else h+=semiSetup(grp,R);
    h+='</section>'}
  return h}
function bracketView(grp,R){const word=grp.format==='pool'?'Pool':'Bracket',po=hasPlayoff(grp),adv=po?(isBQ(grp)?(qfInBracket(grp)&&!qfManual(grp)?4:0):grp.opts.advance):0;
  const pm=grp.matches.filter(m=>m.stage==='pool'),pms=grp.matches.filter(m=>m.po),left=pm.filter(m=>!R[m.id].done).length,hold=!left&&tieProblem(grp,R);
  let h=`<div class="pools">${grp.data.pools.map((pl,pi)=>{const ms=pm.filter(m=>m.pool===pi);const st=ranked(grp,'b'+pi,pl,ms,R);const gDone=ms.every(m=>R[m.id].done);
    return`<section class="sec"><h3>${word} ${LET[pi]} <span class="note">${pl.length} pairs · ${pl.length-1} games each${po?(isBQ(grp)?(adv?' · top 4 play quarterfinals':' · quarterfinals next'):` · top ${adv} advance`):gDone?` · winner: ${esc(nm(st[0].id))}`:''}</span></h3>${rankTable(grp,'b'+pi,st,{adv,of:pl.length-1,complete:gDone})}<div style="margin-top:14px">${rounds(grp,ms,R,grp.data.sits[pi])}</div></section>`}).join('')}</div>`;
  if(!po)return h;
  if(isBQ(grp))return h+bqSection(grp,R,left,pms);
  const fmt=grp.data.poFmt||grp.opts.poFormat||'se';
  h+=`<section class="sec"><h3>Play-off ${pms.length?`<span class="note">${PO_FMT[fmt]} · ${Object.keys(grp.data.poTags||{}).length} pairs</span>${cbtn('reseed','Re-seed from brackets','sm')}`:''}</h3>`;
  if(!pms.length){const G=grp.data.pools.length;
    h+=`<p class="preview" style="margin-bottom:12px"><b>Plan</b>${esc(playoffPreview(G,adv,fmt==='de'&&G*adv<3?'se':fmt,grp.opts.poSeed||'cross',grp.opts.bronze))}</p>
    <div class="row"><button class="btn primary" data-act="seedpo" ${left||hold?'disabled':''}>Seed play-off</button><span class="note">${left?`${left} bracket match${left>1?'es':''} left before seeding.`:hold?`<span class="err">${esc(hold)}</span>`:`Uses the final ${word.toLowerCase()} standings. Tags like A1 show each pair's ${word.toLowerCase()} and finish.`}</span></div>`}
  else if(fmt==='rr'){h+=`${rankTable(grp,'po',tableFor(grp,'po',R),{complete:pms.every(m=>R[m.id].done)})}<div style="margin-top:14px">${rounds(grp,pms,R)}</div>`}
  else if(fmt==='de')h+=deView(grp,R,pms,'po',(t,n,b)=>`<div class="subsec"><div class="rndh"><b>${t}</b><span class="note">${n}</span></div>${b}</div>`);
  else h+=elim(grp,pms,R,seName,'po');
  return h+'</section>'}
function vMain(){const grp=cur();if(!grp)return'';prep(grp);const R=resolve(grp),ch=grp.status==='live'&&champion(grp,R);
  const gtxt=grp.format==='rr'&&hasBrackets(grp)?` · ${grp.opts.brackets||1} bracket${(grp.opts.brackets||1)>1?'s':''}${grp.opts.rrPlayoff?' + play-off':''}`:'';
  return`<div class="head"><div><div class="eyebrow">${FORMATS[grp.format].name}${gtxt} · ${grp.pairs.length} pairs · games to ${grp.gameTo}${grp.winBy?', win by 2':''}</div><h2>${esc(grp.name)} <span class="pill ${grp.status==='live'?(ch?'doneP':'live'):''}">${grp.status==='setup'?'Setup':ch?'Complete':'Live'}</span></h2></div>
  <div class="row" style="gap:8px;align-items:center">${grp.status==='live'?`<label class="toggle podtog"><input type="checkbox" id="pod_${grp.id}" data-act="podium" ${ui.podium===grp.id||podWinOpen(grp.id)?'checked':''}> Winners podium</label>`:''}${grp.status==='live'?cbtn('tosetup','Back to setup','ghost danger'):''}${S.groups.length>1?cbtn('delgrp','Delete group','ghost danger'):''}</div></div>
  ${grp.status==='setup'?vSetup(grp):vLive(grp,R)}`}

function render(){const app=document.getElementById('app');const a=document.activeElement,fid=a&&a.id;let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  const sc={};app.querySelectorAll('[data-keep]').forEach(el=>sc[el.id]=el.scrollLeft);
  app.classList.toggle('wrap',!DISP);
  if(DISP&&!ui.booting){ui.stage=null;const h=vDisplay();if(h!==ui.lastDisp){app.innerHTML=h;ui.lastDisp=h}afterStage();return}
  if(ui.booting){app.innerHTML=`<div class="boot">${BALL}<b>Loading your saved tournament…</b><span class="note">This takes a moment after a refresh.</span></div>`;return}
  ui.stage=null;if(!Array.isArray(S.courts))S.courts=[];CU=courtUse();app.innerHTML=vTop()+(ui.toast?`<div class="toast" role="status"><span>${esc(ui.toast)}</span><button class="btn sm ghost" data-act="toastx">Dismiss</button></div>`:'')+vCourts()+`<div class="shell">${vRail()}<main style="min-width:0">${vMain()}</main></div>`+vBackup()+vPodiumModal()+vCourtsModal();afterStage();syncPodiumWindow();syncCourtsWindow();
  if(ui.ctFocus){ui.ctFocus=false;const x=document.getElementById('ct_new');if(x)try{x.focus({preventScroll:true})}catch(e){}}
  if(ui.podium){const x=document.getElementById('podx');if(x&&fid!=='podx')try{x.focus({preventScroll:true})}catch(e){}}
  Object.entries(sc).forEach(([id,x])=>{const el=document.getElementById(id);if(el)el.scrollLeft=x});
  if(fid){const el=document.getElementById(fid);if(el&&!el.disabled){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}}
function commit(){ui.toast='';save();render()}

/* ---------- actions ---------- */
function setStep(grp,k,v){v=Math.round(v);if(isNaN(v))return;
  if(k==='pairs'){v=Math.max(2,Math.min(64,v));if(v>grp.pairs.length)grp.pairs.push(...mkPairs(v-grp.pairs.length,grp.pairs.length));else grp.pairs.length=v;return}
  if(k==='swissRounds')v=Math.max(1,Math.min(grp.pairs.length-1,v));
  else if(k==='qfCount'){v=Math.max(2,Math.min(Math.floor(grp.pairs.length/2),v));grp.data.qfManual=null}
  else v=Math.max(1,v);
  grp.opts[k]=v}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='closebk'&&e.target.closest('[data-stop]'))return;
  if(t.dataset.act==='podclose'&&e.target.closest('[data-stop]'))return;
  if(t.dataset.act==='podclose'||t.dataset.act==='podx'){ui.podium=null;ui.podFail=false;render();return}
  if(t.dataset.act==='csclose'&&e.target.closest('[data-stop]'))return;
  if(t.dataset.act==='csclose'||t.dataset.act==='csx'){ui.courtsModal=false;ui.csFail=false;render();return}
  const act=t.dataset.act,grp=cur();
  if(['score','pname','grpname','evname','evdate','grpcount','stpin','pbracket','msemi','mqf','mcourt','ctassign','cstog'].includes(act))return;
  if(t.dataset.confirm&&ui.pending!==t.dataset.confirm){ui.pending=t.dataset.confirm;render();return}
  if(act!=='grpminus')ui.pending=null;
  switch(act){
    case'pick':S.active=t.dataset.id;ui.challenge=null;ui.podium=null;break;
    case'grpplus':{if(S.groups.length>=12)return;const b=newGroup(S.groups.length+1);S.groups.push(b);S.active=b.id;break}
    case'grpminus':{const last=S.groups[S.groups.length-1];if(S.groups.length<=1)return;
      if(last.matches.length||last.status==='live'){ui.pending='rmlast';break}S.groups.pop();if(!cur())S.active=S.groups[0].id;break}
    case'rmlastyes':S.groups.pop();if(!S.groups.find(b=>b.id===S.active))S.active=S.groups[0].id;break;
    case'cancel':break;
    case'fresh':S={name:'New Tournament',date:new Date().toISOString().slice(0,10),groups:[],courts:S.sample?[]:(S.courts||[]),sample:false};S.groups.push(newGroup(1));S.active=S.groups[0].id;break;
    case'delgrp':{const i=S.groups.indexOf(grp);S.groups.splice(i,1);S.active=S.groups[Math.max(0,i-1)].id;break}
    case'tosetup':grp.status='setup';grp.matches=[];grp.data={};ui.challenge=null;break;
    case'format':grp.format=t.dataset.v;break;
    case'gameto':grp.gameTo=+t.dataset.v;break;
    case'opt':grp.opts[t.dataset.k]=t.dataset.v;break;
    case'stp':setStep(grp,t.dataset.k,(t.dataset.k==='pairs'?grp.pairs.length:t.dataset.k==='swissRounds'?(grp.opts.swissRounds||swissTotal(grp)):t.dataset.k==='qfCount'?qfCountOf(grp):(grp.opts[t.dataset.k]||1))+(+t.dataset.d));break;
    case'shuffle':for(let i=grp.pairs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[grp.pairs[i],grp.pairs[j]]=[grp.pairs[j],grp.pairs[i]]}break;
    case'pastetoggle':ui.paste[grp.id]=!ui.paste[grp.id];break;
    case'pasteapply':{const ta=document.getElementById('paste_'+grp.id);const lines=(ta?ta.value:'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,64);
      if(lines.length<2)return;grp.pairs=lines.map(n=>({id:uid(),name:n}));ui.paste[grp.id]=false;break}
    case'start':{const o=grp.opts,n=grp.pairs.length,mx=maxBrackets(n);o.pools=Math.max(1,Math.min(o.pools,mx));o.brackets=Math.max(1,Math.min(o.brackets||1,mx));
      if(drawProblem(grp))break;const G=bracketCount(grp);o.advance=Math.max(1,Math.min(o.advance,...bracketAssign(grp,G).map(g=>g.length)));startGroup(grp);break}
    case'drawmode':{const G=bracketCount(grp);if(t.dataset.v==='manual'&&grp.opts.drawMode!=='manual')grp.pairs.forEach((p,i)=>p.g=pairBracket(grp,p,i,G));grp.opts.drawMode=t.dataset.v;break}
    case'drawsnake':{const G=bracketCount(grp);grp.pairs.forEach((p,i)=>p.g=snakeIdx(i,G));break}
    case'seedpo':{const R=resolve(grp);if(tieProblem(grp,R))break;grp.matches=grp.matches.filter(m=>!m.po&&!m.bq);if(isBQ(grp))startBQ(grp,R);else buildPlayoff(grp,R);break}
    case'seedsemi':startSemis(grp,resolve(grp));break;
    case'qfstd':grp.data.qfManual=null;break;
    case'undobq':grp.matches=grp.matches.filter(m=>!m.po&&!m.bq);grp.data.poTags={};grp.data.manual=null;grp.data.poFmt=null;break;
    case'reseed':grp.matches=grp.matches.filter(m=>!m.po);if(!isBQ(grp))grp.data.poTags={};grp.data.poFmt=null;break;
    case'swissnext':swissNext(grp);break;
    case'kotcnext':kotcNext(grp);break;
    case'undoround':{const rd=Math.max(...grp.matches.map(m=>m.round));grp.matches=grp.matches.filter(m=>m.round!==rd);if(grp.format==='kotc')grp.data.wait.length=rd-1;break}
    case'chal':ui.challenge=ui.challenge===t.dataset.id?null:t.dataset.id;break;
    case'chalto':{const n=grp.matches.length+1;grp.matches.push(mk('ld',n,0,P(t.dataset.a),P(t.dataset.b),`Challenge ${n}`));ui.challenge=null;break}
    case'chaldel':grp.matches=grp.matches.filter(m=>m.id!==t.dataset.m);break;
    case'savenow':cloudSave();return;
    case'rkedit':{const R=resolve(grp);ui.rkEdit=grp.id+':'+t.dataset.k;ui.rkDraft=tableFor(grp,t.dataset.k,R).map(s=>s.id);render();return}
    case'rkup':case'rkdn':{const i=+t.dataset.i,j=act==='rkup'?i-1:i+1,d=ui.rkDraft;if(d&&d[j]!==undefined){[d[i],d[j]]=[d[j],d[i]]}render();return}
    case'rkcancel':ui.rkEdit=null;ui.rkDraft=null;render();return;
    case'rksave':{grp.data.rankOv=grp.data.rankOv||{};grp.data.rankOv[t.dataset.k]=(ui.rkDraft||[]).slice();ui.rkEdit=null;ui.rkDraft=null;break}
    case'rkreset':{const k=t.dataset.confirm.split(':').slice(2).join(':');if(grp.data.rankOv)delete grp.data.rankOv[k];break}
    case'ctadd':addCourt();break;
    case'ctdel':removeCourt(t.dataset.id);break;
    case'ctclear':ui.ctErr=assignCourt(t.dataset.g,t.dataset.m,'');break;
    case'ctfold':ui.ctFold=!ui.ctFold;render();return;
    case'cswin':if(openCourtsWindow()){ui.courtsModal=false;ui.csFail=false}else ui.csFail=true;render();return;
    case'podwin':{const id=ui.podium;if(id&&openPodiumWindow(id)){ui.podium=null;ui.podFail=false}else ui.podFail=true;render();return}
    case'fs':try{const de=document.documentElement;const p=document.fullscreenElement?document.exitFullscreen():de.requestFullscreen&&de.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(err){}return;
    case'toastx':ui.toast='';render();return;
    case'backup':ui.backup=true;ui.restoreErr='';break;
    case'closebk':case'closebk2':ui.backup=false;break;
    case'copybk':{const ta=document.getElementById('bk_out'),msg=document.getElementById('bk_msg');
      const ok=()=>{if(msg)msg.textContent='Copied.'};const fb=()=>{ta.focus();ta.select();if(msg)msg.textContent='Selected. Press Ctrl+C or ⌘C to copy.'};
      try{navigator.clipboard.writeText(ta.value).then(ok,fb)}catch(err){fb()}return}
    case'restore':{const v=document.getElementById('bk_in').value.trim();try{const d=JSON.parse(v);if(!d||!(Array.isArray(d.groups)||Array.isArray(d.brackets)))throw 0;S=migrate(d);if(!S.groups.length)throw 0;S.active=S.active||S.groups[0].id;ui.backup=false}catch(err){ui.restoreErr='That text is not a valid backup. Copy the whole backup and paste it again.'}break}
    case'gfreset':case'winby':case'rrpo':case'bronze':case'podium':return;
  }
  commit()});
document.addEventListener('input',e=>{const t=e.target,act=t.dataset&&t.dataset.act;if(!act)return;const grp=cur();
  if(act==='score'){t.value=t.value.replace(/\D/g,'').slice(0,2);const m=grp.matches.find(x=>x.id===t.dataset.m);if(!m)return;const R=resolve(grp),r=R[m.id];
    if(!m.s||m.s.pa!==r.a||m.s.pb!==r.b)m.s={a:null,b:null,pa:r.a,pb:r.b};m.s[t.dataset.side]=t.value===''?null:+t.value;
    if(m.courtId){const r2=resolve(grp)[m.id];if(r2.done){if(!m.finishedAt)m.finishedAt=Date.now()}else{delete m.finishedAt;const u=courtUse()[m.courtId];if(u&&u.m!==m)assignCourt(grp.id,m.id,'')}}
    commit();return}
  if(act==='pname'){const p=grp.pairs.find(x=>x.id===t.dataset.id);if(p)p.name=t.value;commit();return}
  if(act==='grpname'){grp.name=t.value;commit();return}
  if(act==='evname'){S.name=t.value;save();return}});
document.addEventListener('change',e=>{const t=e.target,act=t.dataset&&t.dataset.act;if(!act)return;const grp=cur();
  if(act==='evdate'){S.date=t.value;save();return}
  if(act==='winby'){grp.winBy=t.checked;commit();return}
  if(act==='gfreset'){grp.opts.gfReset=t.checked;commit();return}
  if(act==='rrpo'){grp.opts.rrPlayoff=t.checked;if(t.checked&&(grp.opts.brackets||1)<2&&grp.pairs.length>=4)grp.opts.brackets=2;commit();return}
  if(act==='bronze'){grp.opts.bronze=t.checked;commit();return}
  if(act==='mcourt'){ui.ctErr=assignCourt(t.dataset.g,t.dataset.m,t.value);commit();return}
  if(act==='ctassign'){if(!t.value)return;const[gid,mid]=t.value.split('|');ui.ctErr=assignCourt(gid,mid,t.dataset.c);commit();return}
  if(act==='cstog'){if(t.checked){closeCourtsWindow();if(openCourtsWindow()){ui.courtsModal=false;ui.csFail=false}else{ui.courtsModal=true;ui.csFail=true}}else{closeCourtsWindow();ui.courtsModal=false;ui.csFail=false}render();return}
  if(act==='podium'){if(t.checked){closePodiumWindow();if(openPodiumWindow(grp.id)){ui.podium=null;ui.podFail=false}else{ui.podium=grp.id;ui.podFail=true}}else{closePodiumWindow();ui.podium=null;ui.podFail=false}render();return}
  if(act==='mqf'){const pr=grp.data.qfManual;if(!pr||!pr[+t.dataset.i])return;pr[+t.dataset.i][+t.dataset.j]=t.value||null;commit();return}
  if(act==='msemi'){if(!grp.data.manual)return;grp.data.manual[+t.dataset.i][+t.dataset.j]=t.value||null;commit();return}
  if(act==='pbracket'){const p=grp.pairs.find(x=>x.id===t.dataset.id);if(p)p.g=+t.value;commit();return}
  if(act==='stpin'){setStep(grp,t.dataset.k,parseInt(t.value,10));commit();return}
  if(act==='grpcount'){let v=Math.max(1,Math.min(12,parseInt(t.value,10)||S.groups.length));while(S.groups.length<v)S.groups.push(newGroup(S.groups.length+1));
    while(S.groups.length>v){const last=S.groups[S.groups.length-1];if(last.matches.length||last.status==='live'){ui.pending='rmlast';break}S.groups.pop()}
    if(!cur())S.active=S.groups[0].id;commit()}});
window.addEventListener('beforeunload',e=>{if(cloud.dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();cloudSave();return}
  if(e.key==='Enter'&&e.target&&e.target.id==='ct_new'){e.preventDefault();addCourt();commit();return}
  if(e.key==='Escape'&&ui.courtsModal){ui.courtsModal=false;ui.csFail=false;render();return}
  if(e.key==='Escape'&&ui.podium){ui.podium=null;render();return}
  if(e.key==='Escape'&&ui.backup){ui.backup=false;render()}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('sc')){const all=[...document.querySelectorAll('.sc:not(:disabled)')];const i=all.indexOf(e.target);if(all[i+1])all[i+1].focus()}});

/* ---------- sample ---------- */
function sample(){S={name:'Dink Republic Fall Classic',date:'2026-10-24',groups:[],sample:true};
  const LOSE=[6,9,4,8,7,5,9,3,10,6];let k=0;
  const setScore=(grp,m)=>{const R=resolve(grp),r=R[m.id];if(!r.a||!r.b||r.bye)return;const l=LOSE[k%LOSE.length],aw=k%3!==1;k++;m.s={a:aw?11:l,b:aw?l:11,pa:r.a,pb:r.b}};
  const b1=newGroup(1);b1.name='Mixed 3.5';b1.format='rr';b1.pairs=['Reyes / Santos','Cruz / Bautista','Garcia / Mendoza','Torres / Villanueva','Ramos / Aquino','Flores / Navarro'].map(n=>({id:uid(),name:n}));
  startGroup(b1);b1.matches.filter(m=>m.round<=2).forEach(m=>setScore(b1,m));
  const b2=newGroup(2);b2.name="Men's Open";b2.format='de';b2.pairs=['Dizon / Lim','Tan / Co','Valdez / Ocampo','Pascual / Rivera','Castillo / Salazar','De Leon / Manalo','Soriano / Gatchalian'].map(n=>({id:uid(),name:n}));
  startGroup(b2);b2.matches.filter(m=>m.stage==='wb'&&m.round===1).forEach(m=>setScore(b2,m));b2.matches.filter(m=>m.stage==='wb'&&m.round===2).slice(0,1).forEach(m=>setScore(b2,m));
  const b3=newGroup(3);b3.name="Women's 3.0";b3.format='rr';b3.opts.brackets=2;b3.opts.rrPlayoff=true;b3.opts.advance=2;b3.pairs=['Ang / Sy','Perez / Roxas','Lopez / Yap','Morales / Chua','Domingo / Tiu','Javier / Ong','Herrera / Go','Medina / Lao'].map(n=>({id:uid(),name:n}));
  startGroup(b3);b3.matches.filter(m=>m.round<=2).forEach(m=>setScore(b3,m));
  S.groups=[b1,b2,b3];S.active=b2.id;
  S.courts=['1','2','3','4'].map(n=>({id:uid(),name:n}));
  [[b1,0,7],[b2,1,3]].forEach(([g,ci,min])=>{const R=resolve(g),m=g.matches.find(x=>matchOpen(R[x.id]));if(m){assignCourt(g.id,m.id,S.courts[ci].id);m.startedAt=Date.now()-min*60000-17000}})}

S=load();if(!S){sample();ui.booting=true}if(!S.active||!S.groups.find(b=>b.id===S.active))S.active=S.groups[0].id;
try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}catch(e){localOK=false}
render();initCloud();
})();
